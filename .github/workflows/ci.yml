name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Sanity types are up to date
        run: |
          npm run typegen
          git diff --exit-code -- sanity/types.ts sanity/extract.json || {
            echo "::error::Generated Sanity types are stale. Run 'npm run typegen' and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Add `npm test` and `npm run test:e2e` steps here once those scripts exist.
